[workspace]
members = [
  "crates/gitfoundry-catalog",
  "crates/gfy",
  "crates/mcp-worker"
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
version = "0.0.0-p0.1"

[workspace.dependencies]
async-trait = "0.1"
gitfoundry-catalog = { path = "crates/gitfoundry-catalog" }
incurs = { git = "https://github.com/douglance/incurs", rev = "973a77c908982f6da50398e2910226521ec5bf48", package = "incurs", version = "0.11.0", features = ["cli", "agent-plugins-mcp"] }
incurs-remote = { git = "https://github.com/douglance/incurs", rev = "973a77c908982f6da50398e2910226521ec5bf48", package = "incurs-remote", version = "0.7.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
